$ipc = qs -c noctalia-shell ipc call

# 1. Noctalia binds
bind = SUPER, SPACE, exec, $ipc launcher toggle #"Launcher"
bind = SUPER, S, exec, $ipc controlCenter toggle #"Control Center"
bind = SUPER, comma, exec, $ipc settings toggle #"Settings"
bind = SUPER, F1, exec, $ipc plugin:keybind-cheatsheet toggle #"Cheatsheet"
bind = CTRL ALT, Delete, exec, $ipc sessionMenu toggle #"Session Menu"
bind = SUPER, V, exec, $ipc plugin:clipper toggle #"Clipboard"
bind = SUPER, Tab, exec, $ipc plugin:workspace-overview toggle #"Workspace Overview"

# 2. Windows
bind = Super, D, fullscreen, 1 #"Maximize Window"
bind = Super, F, fullscreen #"Compete Fullscreen"
bind = SUPER SHIFT, F, togglefloating #"Toggle floating"
bind = SUPER, Q, killactive #"Kill active window"
bindmd = SUPER, mouse:272, Move window, movewindow #"move window"
bindmd = SUPER, mouse:273, Resize window, resizewindow #"resize window"
bind = SUPER, right, movefocus, r #"focus next window (right)"
bind = SUPER, left, movefocus, l #"focus next window (left)"
bind = SUPER, up, movefocus, u #"focus next window (up)"
bind = SUPER, down, movefocus, d #"focus next window (down)"
bind = SUPER SHIFT CTRL, down, movewindow, mon:d
bind = SUPER SHIFT CTRL, left, movewindow, mon:l
bind = SUPER SHIFT CTRL, right, movewindow, mon:r
bind = SUPER SHIFT CTRL, up, movewindow, mon:u
bind = SUPER CTRL, left, movewindow, l
binde = SUPER SHIFT, minus, resizeactive, 0 -10%
bind = SUPER CTRL, right, movewindow, r
#bind = SUPER SHIFT, up, movewindow, u
bindd = SUPER, code:20, Expand window left, resizeactive, -100 0
bindd = SUPER, code:21, Shrink window left, resizeactive, 100 0
binde = SUPER, equal, resizeactive, 10% 0
binde = SUPER, minus, resizeactive, -10% 0

# 3. Workspaces
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, I, movetoworkspace, e-1!
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9


# Move focused window to next/previous workspace on same monitor
bind = SUPER, KP_End, workspace, 1 #"switch to #1 (Numpad 1)"
bind = SUPER, KP_Down, workspace, 2 #"switch to #2 (Numpad 2)"
bind = SUPER, KP_Next, workspace, 3 #"switch to #3 (Numpad 3)"
bind = SUPER, KP_Left, workspace, 4 #"switch to #4 (Numpad 4)"
bind = SUPER, KP_Begin, workspace, 5 #"switch to #5 (Numpad 5)"
bind = SUPER, KP_Right, workspace, 6 #"switch to #6 (Numpad 6)"
bind = SUPER SHIFT, KP_End, movetoworkspace, 1 #"move to #1 (Numpad 1)"
bind = SUPER SHIFT, KP_Down, movetoworkspace, 2 #"move to #2 (Numpad 2)"
bind = SUPER SHIFT, KP_Next, movetoworkspace, 3 #"move to #3 (Numpad 3)"
bind = SUPER SHIFT, KP_Left, movetoworkspace, 4 #"move to #4 (Numpad 4)"
bind = SUPER SHIFT, KP_Begin, movetoworkspace, 5 #"move to #5 (Numpad 5)"
bind = SUPER SHIFT, KP_Right, movetoworkspace, 6 #"move to #6 (Numpad 6)"
bind = SUPER SHIFT, right, movetoworkspace, m+1 #"Move focused window to next/previous workspace on same monitor"
bind = SUPER SHIFT, left,  movetoworkspace, m-1 #"Move focused window to next/previous workspace on same monitor"

# 4. System and apps
bind = Super, E, exec, dolphin #"Dolphin"
bind = Super, Return, exec, kitty #"Terminal"
bind = , Print, exec, catbox #"Catbox"
bind = Super Shift, V, exec, pwvucontrol #"Volume Control Panel"
bind = SUPER, M, exec, togglemute #"Toggle Mute"

# Media keys
bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease
bindl = , XF86AudioMute, exec, $ipc volume muteOutput
bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase
bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease